name: "kube-secret-manager"
description: "Injects cluster authentication tokens, image pull secrets, and sensitive pipeline environment credentials."
input_schema:
  type: object
  properties:
    secret_name:
      type: string
      description: "Name of the Kubernetes secret or credential."
    namespace:
      type: string
      description: "Target Kubernetes namespace."
    mount_as:
      type: string
      description: "Mount format for secret injection (env_var, volume_mount, pull_secret)."
      enum:
        - "env_var"
        - "volume_mount"
        - "pull_secret"
  required:
    - secret_name
    - namespace
    - mount_as
